services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-krishimitra}
      POSTGRES_USER: ${POSTGRES_USER:-krishimitra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krishimitra-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: development
    environment:
      APP_ENV: development
      APP_NAME: KrishiMitra AI
      API_VERSION: v1
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-krishimitra}:${POSTGRES_PASSWORD:-krishimitra-local-only}@db:5432/${POSTGRES_DB:-krishimitra}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
