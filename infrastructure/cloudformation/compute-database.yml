AWSTemplateFormatVersion: "2010-09-09"
Description: KrishiMitra AI Phase 1 development EC2 and RDS foundation

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  Ec2SubnetId:
    Type: AWS::EC2::Subnet::Id
  AmiId:
    Type: AWS::EC2::Image::Id
  DocumentsBucketName:
    Type: String
  ImagesBucketName:
    Type: String
  GeminiSecretArn:
    Type: String
    Default: ""

Conditions:
  HasGeminiSecret: !Not [!Equals [!Ref GeminiSecretArn, ""]]

Resources:
  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: KrishiMitra development FastAPI health access; no SSH
      GroupName: krishimitra-dev-backend-sg
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0
          Description: Temporary development health endpoint
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - { Key: Name, Value: krishimitra-dev-backend-sg }
        - { Key: Project, Value: KrishiMitra-AI }
        - { Key: Environment, Value: development }

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL reachable only from KrishiMitra backend security group
      GroupName: krishimitra-dev-db-sg
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref BackendSecurityGroup
          Description: PostgreSQL from backend only
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - { Key: Name, Value: krishimitra-dev-db-sg }
        - { Key: Project, Value: KrishiMitra-AI }
        - { Key: Environment, Value: development }

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: KrishiMitra development database subnets
      DBSubnetGroupName: krishimitra-dev-db-subnets
      SubnetIds: !Ref SubnetIds
      Tags:
        - { Key: Project, Value: KrishiMitra-AI }
        - { Key: Environment, Value: development }

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: krishimitra-dev-db
      DBName: krishimitra
      Engine: postgres
      EngineVersion: "17.11"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      MaxAllocatedStorage: 25
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: krishimitra_admin
      ManageMasterUserPassword: true
      MultiAZ: false
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      EnablePerformanceInsights: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      Tags:
        - { Key: Project, Value: KrishiMitra-AI }
        - { Key: Environment, Value: development }

  BackendRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: krishimitra-dev-backend-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: krishimitra-development-storage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${DocumentsBucketName}
                  - !Sub arn:${AWS::Partition}:s3:::${ImagesBucketName}
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${DocumentsBucketName}/connectivity/*
                  - !Sub arn:${AWS::Partition}:s3:::${DocumentsBucketName}/government/*
                  - !Sub arn:${AWS::Partition}:s3:::${DocumentsBucketName}/processed/*
                  - !Sub arn:${AWS::Partition}:s3:::${DocumentsBucketName}/attachments/*
                  - !Sub arn:${AWS::Partition}:s3:::${ImagesBucketName}/connectivity/*
                  - !Sub arn:${AWS::Partition}:s3:::${ImagesBucketName}/attachments/*
                  - !Sub arn:${AWS::Partition}:s3:::${ImagesBucketName}/farmer-uploads/*
                  - !Sub arn:${AWS::Partition}:s3:::${ImagesBucketName}/analysis-results/*
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:krishimitra-dev-image-analysis
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn
              - !If
                - HasGeminiSecret
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref GeminiSecretArn
                - !Ref AWS::NoValue
      Tags:
        - { Key: Project, Value: KrishiMitra-AI }
        - { Key: Environment, Value: development }

  BackendInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: krishimitra-dev-backend-profile
      Roles: [!Ref BackendRole]

  BackendInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t3.micro
      IamInstanceProfile: !Ref BackendInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeleteOnTermination: true
          DeviceIndex: "0"
          GroupSet: [!Ref BackendSecurityGroup]
          SubnetId: !Ref Ec2SubnetId
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        InstanceMetadataTags: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 8
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker python3-pip
          dnf install -y amazon-cloudwatch-agent || true
          systemctl enable --now docker
          useradd --system --home /opt/krishimitra --shell /sbin/nologin krishimitra || true
          mkdir -p /opt/krishimitra
          cat > /opt/krishimitra/main.py <<'PY'
          from fastapi import FastAPI
          app = FastAPI(title="KrishiMitra AI", version="0.1.0")
          @app.get("/health")
          async def health():
              return {"status": "ok"}
          PY
          python3 -m pip install --upgrade fastapi 'uvicorn[standard]'
          chown -R krishimitra:krishimitra /opt/krishimitra
          cat > /etc/systemd/system/krishimitra.service <<'UNIT'
          [Unit]
          Description=KrishiMitra Phase 1 FastAPI foundation
          After=network-online.target
          Wants=network-online.target
          [Service]
          User=krishimitra
          WorkingDirectory=/opt/krishimitra
          ExecStart=/usr/local/bin/uvicorn main:app --host 0.0.0.0 --port 8000
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now krishimitra
          if [ -x /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl ]; then
            cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<'JSON'
          {"agent":{"metrics_collection_interval":60},"logs":{"logs_collected":{"files":{"collect_list":[{"file_path":"/var/log/messages","log_group_name":"/krishimitra/dev/ec2","log_stream_name":"{instance_id}","retention_in_days":14}]}}}}
          JSON
            /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json || true
          fi
      Tags:
        - { Key: Name, Value: krishimitra-dev-backend }
        - { Key: Project, Value: KrishiMitra-AI }
        - { Key: Environment, Value: development }

Outputs:
  BackendInstanceId: { Value: !Ref BackendInstance }
  BackendPublicIp: { Value: !GetAtt BackendInstance.PublicIp }
  BackendHealthUrl: { Value: !Sub "http://${BackendInstance.PublicIp}:8000/health" }
  BackendSecurityGroupId: { Value: !Ref BackendSecurityGroup }
  DatabaseIdentifier: { Value: !Ref Database }
  DatabaseEndpoint: { Value: !GetAtt Database.Endpoint.Address }
  DatabasePort: { Value: !GetAtt Database.Endpoint.Port }
  DatabaseSecretArn: { Value: !GetAtt Database.MasterUserSecret.SecretArn }
  DatabaseSecurityGroupId: { Value: !Ref DatabaseSecurityGroup }
